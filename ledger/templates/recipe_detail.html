{% extends 'base.html' %}

	{% block content %}

	<a href = "{% url 'ledger:recipe_list' %}">Back to Recipe List</a>

	<h2>Recipe Detail</h2>
	<h3> {{ recipe.name }}</h3>
	<p>Author: {{ recipe.author.name }} </p>

	<ul>
		{% for ingredient in recipe.ingredients.all %}
			<li>
				{{ ingredient.quantity }} - {{ ingredient.ingredient.name }}
			</li>
		{% endfor %}
	</ul>

{% endblock %}
