{% extends 'base.html' %}
{% load static %}

	{% block content %}
	<h2>Recipe List</h2>

	<ul>
		{% for recipe in recipe_list %}
			<li>
				<a href = "{{ recipe.get_absolute_url }}"> 
					{{recipe.name}} 
				</a>
			</li>
		{% endfor %}
	</ul>

	<br>

	<a href = "{% url 'ledger:recipe_add' %}">Add Recipe</a>
	
{% endblock %}
